<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" fill="none">
  <style>
    @keyframes countUp {
      from { opacity: 0; transform: translateY(8px) }
      to { opacity: 1; transform: translateY(0) }
    }
    @keyframes barGrow {
      from { width: 0 }
      to { width: 100% }
    }
    .metric-value {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 26px;
      font-weight: 800;
      animation: countUp 0.8s ease both;
    }
    .metric-label {
      font-family: 'Courier New', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      fill: #64748b;
      animation: countUp 0.8s ease both;
    }
    .divider {
      stroke: #1e293b;
      stroke-width: 1;
    }
  </style>

  <!-- Background -->
  <rect width="800" height="80" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>

  <!-- Projects -->
  <g style="animation-delay: 0.1s">
    <text x="60" y="35" class="metric-value" fill="#c084fc" text-anchor="middle" style="animation-delay: 0.2s">9+</text>
    <text x="60" y="58" class="metric-label" text-anchor="middle" style="animation-delay: 0.3s">Projects</text>
  </g>
  <line x1="140" y1="15" x2="140" y2="65" class="divider"/>

  <!-- Live -->
  <g>
    <text x="220" y="35" class="metric-value" fill="#34d399" text-anchor="middle" style="animation-delay: 0.4s">6</text>
    <text x="220" y="58" class="metric-label" text-anchor="middle" style="animation-delay: 0.5s">Live</text>
  </g>
  <line x1="300" y1="15" x2="300" y2="65" class="divider"/>

  <!-- AI Agents -->
  <g>
    <text x="395" y="35" class="metric-value" fill="#06b6d4" text-anchor="middle" style="animation-delay: 0.6s">12+</text>
    <text x="395" y="58" class="metric-label" text-anchor="middle" style="animation-delay: 0.7s">AI Agents</text>
  </g>
  <line x1="490" y1="15" x2="490" y2="65" class="divider"/>

  <!-- Domains -->
  <g>
    <text x="570" y="35" class="metric-value" fill="#fbbf24" text-anchor="middle" style="animation-delay: 0.8s">5</text>
    <text x="570" y="58" class="metric-label" text-anchor="middle" style="animation-delay: 0.9s">Domains</text>
  </g>
  <line x1="650" y1="15" x2="650" y2="65" class="divider"/>

  <!-- Company -->
  <g>
    <text x="730" y="35" class="metric-value" fill="#f472b6" text-anchor="middle" style="animation-delay: 1.0s">1</text>
    <text x="730" y="58" class="metric-label" text-anchor="middle" style="animation-delay: 1.1s">Company</text>
  </g>
</svg>
