<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <style>
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px) }
      to { opacity: 1; transform: translateX(0) }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.7 }
      50% { opacity: 1 }
    }
    .category {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .tech {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 12px;
      fill: #cbd5e1;
    }
    .dot {
      animation: pulse 2s ease-in-out infinite;
    }
    .row {
      animation: slideIn 0.6s ease both;
    }
  </style>

  <!-- Backend -->
  <g class="row" style="animation-delay: 0.1s">
    <circle cx="16" cy="20" r="4" fill="#c084fc" class="dot"/>
    <text x="28" y="24" class="category" fill="#c084fc">Backend</text>
    <text x="120" y="24" class="tech">Python . FastAPI . LangGraph . vLLM . Celery . Redis</text>
  </g>

  <!-- Frontend -->
  <g class="row" style="animation-delay: 0.2s">
    <circle cx="16" cy="52" r="4" fill="#06b6d4" class="dot" style="animation-delay: 0.3s"/>
    <text x="28" y="56" class="category" fill="#06b6d4">Frontend</text>
    <text x="120" y="56" class="tech">Next.js . React . TypeScript . Tailwind CSS . Remotion</text>
  </g>

  <!-- Data -->
  <g class="row" style="animation-delay: 0.3s">
    <circle cx="16" cy="84" r="4" fill="#34d399" class="dot" style="animation-delay: 0.6s"/>
    <text x="28" y="88" class="category" fill="#34d399">Data</text>
    <text x="120" y="88" class="tech">PostgreSQL . Supabase (RLS) . Qdrant . STIX 2.1 . MITRE ATT&amp;CK</text>
  </g>

  <!-- Infra -->
  <g class="row" style="animation-delay: 0.4s">
    <circle cx="16" cy="116" r="4" fill="#fbbf24" class="dot" style="animation-delay: 0.9s"/>
    <text x="28" y="120" class="category" fill="#fbbf24">Infra</text>
    <text x="120" y="120" class="tech">Hetzner . Dokploy . Docker . Cloudflare . Tailscale . n8n</text>
  </g>

  <!-- AI/ML -->
  <g class="row" style="animation-delay: 0.5s">
    <circle cx="16" cy="148" r="4" fill="#f472b6" class="dot" style="animation-delay: 1.2s"/>
    <text x="28" y="152" class="category" fill="#f472b6">AI/ML</text>
    <text x="120" y="152" class="tech">Qwen3.5 . Phi-4 . Codestral . Claude . OpenTelemetry . Cognee</text>
  </g>

  <!-- Security -->
  <g class="row" style="animation-delay: 0.6s">
    <circle cx="16" cy="180" r="4" fill="#ef4444" class="dot" style="animation-delay: 1.5s"/>
    <text x="28" y="184" class="category" fill="#ef4444">Security</text>
    <text x="120" y="184" class="tech">ENS Alto . ISO 27001 . DORA . NIS2 . EU AI Act . RGPD . mTLS</text>
  </g>
</svg>
